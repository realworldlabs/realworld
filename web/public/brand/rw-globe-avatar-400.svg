<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="#ffffff"/>
    <g transform="rotate(-18 200 200)">
      <circle cx="200" cy="200" r="125" fill="#0e0e0e"/>
      <!-- meridians: two ellipses traced with the background colour -->
      <ellipse cx="200" cy="200" rx="52.5" ry="127.5" fill="none" stroke="#ffffff" stroke-width="18.75"/>
      <!-- equator, curved as on a tilted sphere -->
      <path d="M 72.5 200 Q 200 242.5 327.5 200" fill="none" stroke="#ffffff" stroke-width="18.75"/>
      <!-- the cut: a notch at the top right, the "real-world" piece leaving the globe -->
      <path d="M 268.75 68.75 L 331.25 131.25 L 331.25 68.75 Z" fill="#ffffff"/>
    </g></svg>