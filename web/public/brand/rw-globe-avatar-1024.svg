<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#ffffff"/>
    <g transform="rotate(-18 512 512)">
      <circle cx="512" cy="512" r="320" fill="#0e0e0e"/>
      <!-- meridians: two ellipses traced with the background colour -->
      <ellipse cx="512" cy="512" rx="134.4" ry="326.4" fill="none" stroke="#ffffff" stroke-width="48"/>
      <!-- equator, curved as on a tilted sphere -->
      <path d="M 185.60000000000002 512 Q 512 620.8 838.4 512" fill="none" stroke="#ffffff" stroke-width="48"/>
      <!-- the cut: a notch at the top right, the "real-world" piece leaving the globe -->
      <path d="M 688 176 L 848 336 L 848 176 Z" fill="#ffffff"/>
    </g></svg>