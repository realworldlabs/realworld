<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="400" viewBox="0 0 2000 400"><rect width="2000" height="400" fill="#0e0e0e"/>
    <g transform="rotate(-18 200 200)">
      <circle cx="200" cy="200" r="115" fill="#ffffff"/>
      <!-- meridians: two ellipses traced with the background colour -->
      <ellipse cx="200" cy="200" rx="48.3" ry="117.3" fill="none" stroke="#0e0e0e" stroke-width="17.25"/>
      <!-- equator, curved as on a tilted sphere -->
      <path d="M 82.7 200 Q 200 239.1 317.3 200" fill="none" stroke="#0e0e0e" stroke-width="17.25"/>
      <!-- the cut: a notch at the top right, the "real-world" piece leaving the globe -->
      <path d="M 263.25 79.25 L 320.75 136.75 L 320.75 79.25 Z" fill="#0e0e0e"/>
    </g><text x="370" y="258" font-family="IBM Plex Sans" font-size="152" font-weight="700" letter-spacing="-4.56" fill="#ffffff">realworld<tspan font-weight="400" fill="#9a9a9a">.family</tspan></text></svg>